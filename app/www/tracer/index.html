<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="color-scheme" content="light dark">
    <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, height=device-height, target-densitydpi=device-dpi" />

    <link rel="stylesheet" href="../css/base.css" type="text/css" media="screen">
    <link rel="stylesheet" href="../css/tracer.css" type="text/css" media="screen">

    <title>SproutPlay - Tracer!</title>
</head>
<body>
    <div class="app-container">

        <header class="tracer-header">
            <button id="tracer-back" class="back-button" aria-label="Back to hub">← Back</button>
            <h1 class="tracer-title">Tracer ✏️</h1>
        </header>

        <div id="mode-bar" class="mode-bar">
            <button class="mode-btn active" data-mode="numbers">Numbers ✏️</button>
            <button class="mode-btn" data-mode="letters">Letters 🔤</button>
            <button class="mode-btn" data-mode="multi-digit">Multi 🔢</button>
            <button class="mode-btn" data-mode="words">Words 📝</button>
        </div>

        <div id="difficulty-bar" class="difficulty-bar">
            <button class="diff-btn active" data-difficulty="easy">Easy ⭐</button>
            <button class="diff-btn" data-difficulty="medium">Medium ⭐⭐</button>
            <button class="diff-btn" data-difficulty="hard">Hard ⭐⭐⭐</button>
        </div>

        <div id="game-area" class="game-area">
            <div id="prompt-banner" class="prompt-banner">Trace the number 0!</div>
            <div id="streak-badge" class="streak-badge" style="display:none">
                <span class="streak-flame">🔥</span>
                <span id="streak-count">0</span>
            </div>
            <canvas id="tracer-canvas" class="tracer-canvas"></canvas>
        </div>

        <div id="celebration" class="celebration-overlay" style="display:none">
            <div class="celebration-card">
                <div class="celebration-emoji">🎉</div>
                <h2 id="celebration-title">Great Tracing!</h2>
                <p id="celebration-msg">You did it!</p>
                <p id="celebration-meaning" class="celebration-meaning"></p>
                <button id="play-again-btn" class="play-again-button">Play Again 🎮</button>
                <button id="celebration-back" class="play-again-button secondary">Back to Hub</button>
            </div>
        </div>

    </div>

    <script src="../js/sound.js"></script>
    <script src="../js/mini-app-back.js"></script>
    <script src="../js/tracer/paths.js"></script>
    <script src="../js/tracer/tracer.js"></script>

</body>
</html>
